name: Browser checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test browser behavior and capture screenshots
        run: node scripts/browser-check.mjs
      - name: Browser-check English locale
        shell: bash
        run: |
          sed -i "s/locale: 'zh-CN'/locale: 'en-US'/" src/config.ts
          npm run build
          node scripts/i18n-smoke.mjs
          node scripts/i18n-browser-check.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plain-browser-screenshots
          path: screenshots/
          if-no-files-found: ignore
