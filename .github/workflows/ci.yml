name: Verify theme
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node scripts/preview-base.test.mjs
      - run: npm run check
      - run: npm run build
      - run: node scripts/smoke.mjs
      - name: Verify English locale
        run: |
          cp src/config.ts /tmp/plain-config.ts
          sed -i "s/locale: 'zh-CN'/locale: 'en-US'/" src/config.ts
          npm run build
          node scripts/i18n-smoke.mjs
          cp /tmp/plain-config.ts src/config.ts
